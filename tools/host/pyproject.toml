[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "umcub"
version = "0.6.10"
description = "Host library and command line tool for the umcub bootloader"
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5",
  "psutil>=5.9",           # network interfaces for umcub.adapters()
  "smpclient>=7.3",
  "python-can>=4.3",
  "can-isotp>=2.0",
  "cryptography",
  "gs_usb>=0.3; sys_platform == 'win32'",     # candleLight adapters (python-can's gs_usb interface)
  "libusb1>=3; sys_platform == 'win32'",      # their libusb-1.0.dll (adapter.prime_libusb)
]

[project.optional-dependencies]
build = ["esp-idf-kconfig>=3.14,<4"]   # umcub config / image: the bootloader and application builds

[project.scripts]
umcub = "umcub.cli:main"

[tool.setuptools]
packages = ["umcub"]
