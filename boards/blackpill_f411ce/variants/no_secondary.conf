# One image in sectors 5-7 (384 KiB), no secondary slot: images come only through recovery uploads
# straight into the primary slot, there is nothing to install from or to go back to.
UMCUB_CFG_IMG0_PRIMARY_SIZE=0x60000
UMCUB_CFG_IMG0_SECONDARY_ADDR=0x0
UMCUB_CFG_IMG0_SECONDARY_SIZE=0x0
UMCUB_CFG_LAYOUT_NO_UPGRADE=y
