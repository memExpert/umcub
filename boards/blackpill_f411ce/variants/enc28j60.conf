# Ethernet through an ENC28J60 module on SPI1 (driver:
# boards/blackpill_f411ce/enc28j60.c) under the built-in IPv4 / DHCP / UDP
# transport (SMP on port 1337); use with usart2.conf for SMP and log on USART2
# PA2 / PA3. About 30 K: still in the default 32 KiB bootloader (sectors 0-1).
# Wiring: SCK PA5, SO (MISO) PA6, SI (MOSI) PA7, CS PA4, RESET PB0; INT
# unused (polled). The ENC28J60 draws up to 180 mA: the 5 V modules have their
# own regulator.
UMCUB_CFG_TRANSPORT_ETH=y
UMCUB_CFG_ETH_DRIVER_BOARD=y
UMCUB_CFG_ENC28J60=y
