# umcub link node address from a flash word (after rs485.conf, rs485_link.conf).
# The 64 KiB part has no page outside the bootloader and the slots: the bench
# uses the spare page at the end of the 32 KiB bootloader region (below the
# info block). A product puts the word into the page with the application's settings.
UMCUB_CFG_NODE_ADDR_FLASH=0x08007C00
