# USB CDC + DFU: 44 KiB bootloader, two 10 KiB slots; no wait window (the
# host enumerates the device instead).
UMCUB_CFG_BOOT_SIZE=0xB000
UMCUB_CFG_IMG0_PRIMARY_ADDR=0x0800B000
UMCUB_CFG_IMG0_PRIMARY_SIZE=0x2800
UMCUB_CFG_IMG0_SECONDARY_ADDR=0x0800D800
UMCUB_CFG_IMG0_SECONDARY_SIZE=0x2800
UMCUB_CFG_TRANSPORT_USB_CDC=y
UMCUB_CFG_TRANSPORT_USB_DFU=y
UMCUB_CFG_ENTRY_WAIT_MS=0
