# umcub link SECURE (after rs485.conf): host authentication and session MAC,
# no payload encryption. The ECC code does not fit the 32 KiB region:
# bootloader 36 KiB + two 14 KiB slots.
UMCUB_CFG_UART_LINK_SECURE=y
UMCUB_CFG_BOOT_SIZE=0x9000
UMCUB_CFG_IMG0_PRIMARY_ADDR=0x08009000
UMCUB_CFG_IMG0_PRIMARY_SIZE=0x3800
UMCUB_CFG_IMG0_SECONDARY_ADDR=0x0800C800
UMCUB_CFG_IMG0_SECONDARY_SIZE=0x3800
