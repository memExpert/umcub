# umcub link SECURE with encryption on the UART, encrypted images: a 48 KiB
# bootloader, the slots behind it 208 KiB each.
UMCUB_CFG_UART_LINK_SECURE=y
UMCUB_CFG_LINK_ENCRYPT=y
UMCUB_CFG_ENCRYPT_IMAGES=y
UMCUB_CFG_BOOT_SIZE=0xC000
UMCUB_CFG_IMG0_PRIMARY_ADDR=0x0800C000
UMCUB_CFG_IMG0_PRIMARY_SIZE=0x34000
UMCUB_CFG_IMG0_SECONDARY_SIZE=0x34000
