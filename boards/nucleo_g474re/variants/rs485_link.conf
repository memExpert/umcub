# RS485 on a shared bus with umcub link addressing: USART2 PA2 / PA3 through a
# transceiver (e.g. a MAX485), DE (with /RE) driven by the USART itself on PA1
# (USART2_DE, ARDUINO A1). The ST-LINK virtual COM port is on PA2 / PA3 as
# well: open SB17 / SB23 (UM2505 Table 11). No log on a shared bus.
UMCUB_CFG_UART_DE_PA1_HW=y
UMCUB_CFG_UART_TURNAROUND_MS=1
UMCUB_CFG_LOG_LEVEL=0
UMCUB_CFG_UART_LINK_ADDRESSED=y
