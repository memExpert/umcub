# The minimum for an STM32H7: H743, 8 MHz crystal, UART on USART1 PA9/PA10, recovery by a
# button on PC13 (low = pressed), explicit layout.
UMCUB_CFG_PART_STM32H743ZITX=y
UMCUB_CFG_CLOCK_HSE=y
UMCUB_CFG_HSE_HZ=8000000
UMCUB_CFG_PWR_SUPPLY_LDO=y
UMCUB_CFG_UPGRADE_MODE_SWAP_OFFSET=y
UMCUB_CFG_BOOT_SIZE=0x20000
# UMCUB_CFG_LAYOUT_AUTO is not set
UMCUB_CFG_IMG0_PRIMARY_ADDR=0x08020000
UMCUB_CFG_IMG0_PRIMARY_SIZE=0x60000
UMCUB_CFG_IMG0_SECONDARY_ADDR=0x08080000
UMCUB_CFG_IMG0_SECONDARY_SIZE=0x80000
UMCUB_CFG_ENTRY_GPIO=y
UMCUB_CFG_ENTRY_GPIO_PC13=y
# UMCUB_CFG_ENTRY_GPIO_ACTIVE is not set
UMCUB_CFG_ENTRY_GPIO_PULL_UP=y
UMCUB_CFG_UART_INSTANCE_1=y
UMCUB_CFG_UART_TX_PA9=y
UMCUB_CFG_UART_RX_PA10=y
