# No board: STM32H755ZIT, one bootloader on the CM7, SMP on USART3 PD8/PD9
# (the NUCLEO-H755ZI-Q VCP), the slots in the two banks.
UMCUB_CFG_PART_STM32H755ZITX=y
UMCUB_CFG_IMG0_PRIMARY_ADDR=0x08020000
UMCUB_CFG_IMG0_PRIMARY_SIZE=0xE0000
UMCUB_CFG_IMG0_SECONDARY_ADDR=0x08100000
UMCUB_CFG_IMG0_SECONDARY_SIZE=0xE0000
UMCUB_CFG_PWR_SUPPLY_DIRECT_SMPS=y
UMCUB_CFG_UART_INSTANCE_3=y
UMCUB_CFG_UART_TX_PD8=y
UMCUB_CFG_UART_RX_PD9=y
